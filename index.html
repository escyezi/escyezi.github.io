<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escyezi.github.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .card .learn-more {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 25px;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .card:hover .learn-more {
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            background: #f0f0f0;
            color: #666;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <a href="/bubble" class="card" aria-label="访问 Bubble 仓库">
        <span class="badge" aria-label="仓库"><span aria-hidden="true">📦</span> Repository</span>
        <h1>Bubble</h1>
        <p>纯前端的聊天小助手原型：一个颜文字 Bubble + 输入框，通过 OpenAI 兼容接口进行流式对话。</p>
        <p>支持情绪标签驱动表情切换，并把对话与设置持久化到浏览器本地存储。</p>
        <span class="learn-more">了解更多 →</span>
    </a>
</body>
</html>
